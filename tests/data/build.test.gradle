import com.google.gson.JsonObject

// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
// Top-level build file where you can add configuration options common to all sub-projects/modules.
    repositories {
        maven {
            url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public'
            content {
                excludeGroupByRegex("com\\.github\\..*")
                excludeGroupByRegex("com\\.gitee\\..*")
                excludeGroupByRegex("com\\.gitlab\\..*")
            }

        }
//        maven { url "https://repo.huaweicloud.com/repository/maven" }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url "https://maven.aliyun.com/repository/gradle-plugin" }

        maven {
            url "https://jitpack.io/"
            content {
                includeGroupByRegex("com\\.github.*")
                includeGroupByRegex("com\\.gitee.*")
                includeGroupByRegex("com\\.gitlab.*")
                includeGroupByRegex("org\\.bitbucket.*")
                includeGroupByRegex("org\\.azure.*")
            }
        }

        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath("org.json:json:20250107")
    }
}

plugins {
    id 'com.android.application' version '8.9.3' apply false
    id 'com.android.library' version '8.9.3' apply false
}


allprojects { project ->
    String storageUrl = System.env.FLUTTER_STORAGE_BASE_URL ?: 'https://storage.flutter-io.cn'
    repositories {
        maven {
            url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public'
            content {
                excludeGroupByRegex("com\\.github\\..*")
                excludeGroupByRegex("com\\.gitee\\..*")
                excludeGroupByRegex("com\\.gitlab\\..*")
            }

        }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven {
            url rootProject.file('flutter_module/repo')
        }
        maven {
            url "$storageUrl/download.flutter.io"
        }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven {
            url "https://jitpack.io/"
            content {
                includeGroupByRegex("com\\.github.*")
                includeGroupByRegex("com\\.gitee.*")
                includeGroupByRegex("com\\.gitlab.*")
                includeGroupByRegex("org\\.bitbucket.*")
                includeGroupByRegex("org\\.azure.*")

            }
        }

        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
    }

}

apply { from 'build_custom.gradle' }

if (isEnableByeByeJetifierPlugin.toBoolean()) {
    apply plugin: "com.dipien.byebyejetifier"
}

task clean(type: Delete) {
    delete rootProject.buildDir
}


